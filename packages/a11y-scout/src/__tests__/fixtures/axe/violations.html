<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>axe-core violations fixture</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
</head>
<body>
  <!-- html-has-lang: <html> has no lang attribute -->

  <!-- image-alt (1.1.1): img with no alt -->
  <img src="photo.png">

  <!-- input-image-alt (1.1.1): image button with no alt -->
  <input type="image" src="submit.png">

  <!-- link-name (4.1.2 / 2.4.4): anchor with no discernible text -->
  <a href="/empty"></a>

  <!-- button-name (4.1.2): button with no text -->
  <button></button>

  <!-- label (4.1.2 / 3.3.2): input with no associated label -->
  <input type="text" name="bare">

  <!-- select-name: select with no accessible name -->
  <select name="choices"><option>One</option></select>

  <!-- color-contrast (1.4.3): light grey text on white -->
  <p style="color:#dddddd;background:#ffffff">Low contrast paragraph text here.</p>

  <!-- aria-required-attr / aria-valid-attr-value: checkbox role missing aria-checked -->
  <div role="checkbox" tabindex="0">Toggle me</div>

  <!-- aria-hidden-focus (4.1.2): focusable element inside aria-hidden -->
  <div aria-hidden="true"><button>Hidden but focusable</button></div>

  <!-- duplicate-id-aria / duplicate-id: repeated ids -->
  <div id="dupe">First</div>
  <div id="dupe">Second</div>

  <!-- list (1.3.1): <ul> with a non-<li> direct child -->
  <ul><div>Not a list item</div></ul>

  <!-- definition-list: <dl> with invalid structure -->
  <dl><div>Bad dl child</div></dl>

  <!-- th-has-data-cells / empty-table-header / table structure -->
  <table>
    <tr><th></th></tr>
    <tr><td>cell</td></tr>
  </table>

  <!-- heading-order / page heading structure: h4 with no h1-h3 before, plus empty heading -->
  <h4>Skipped heading levels</h4>
  <h2></h2>

  <!-- frame-title: iframe with no title -->
  <iframe src="about:blank"></iframe>

  <!-- meta-viewport (1.4.4): user-scalable=no + maximum-scale=1 (set in head above) -->

  <!-- nested-interactive (4.1.2): button inside button -->
  <button>Outer <button>Inner</button></button>

  <!-- tabindex (best practice): positive tabindex -->
  <a href="/x" tabindex="5">Positive tabindex link</a>

  <!-- region / landmark / main: no <main> landmark, content outside landmarks -->
  <p>Some body content that is not contained in any landmark region at all.</p>
</body>
</html>
