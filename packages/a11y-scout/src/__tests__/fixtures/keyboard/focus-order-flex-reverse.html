<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Flex reorder</title>
<style>
  .row{display:flex;flex-direction:row-reverse;gap:8px;}
  .row button{order:0;width:120px;height:40px;}
</style></head>
<body>
  <div class="row">
    <button>A</button><button>B</button><button>C</button><button>D</button>
    <button>E</button><button>F</button><button>G</button><button>H</button>
  </div>
</body></html>
