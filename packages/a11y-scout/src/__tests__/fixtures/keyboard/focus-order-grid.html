<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Grid layout</title>
<style>
  .grid{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-flow:column;gap:8px;}
  .grid button{height:40px;}
</style></head>
<body>
  <div class="grid">
    <button>1</button><button>2</button><button>3</button><button>4</button>
    <button>5</button><button>6</button><button>7</button><button>8</button>
  </div>
</body></html>
