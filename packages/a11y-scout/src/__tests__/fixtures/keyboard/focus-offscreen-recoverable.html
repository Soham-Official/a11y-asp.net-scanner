<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Focus below the fold — recoverable by scrollIntoView (no finding)</title>
  <style>
    body { height: 3000px; }
    /* A normal in-flow button far below the fold. It starts outside the
       viewport, but scrollIntoView() brings it in — exactly the legitimate
       lazy/long-page case the guard protects. Expected: 0 findings. */
    #below { position: absolute; top: 2500px; left: 0; }
  </style>
</head>
<body>
  <h1>Top of page</h1>
  <button id="top-btn">Top button</button>
  <button id="below">Button below the fold</button>
</body>
</html>
