<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Correct Modal</title>
  <style>
    .modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: white; border: 2px solid black; padding: 20px; z-index: 1000; }
    .modal[hidden] { display: none; }
  </style>
</head>
<body>
  <h1>Correct Modal Test</h1>
  <button id="open-modal">Open Modal</button>
  <div class="modal" role="dialog" aria-modal="true" id="modal" hidden>
    <h2>Modal Title</h2>
    <input type="text" id="modal-input" value="Input in modal">
    <button id="modal-button">Action</button>
    <button id="close-modal">Close</button>
  </div>
  <script>
    const modal = document.getElementById('modal');
    const openBtn = document.getElementById('open-modal');
    const closeBtn = document.getElementById('close-modal');
    let previousFocus = null;

    function focusable() {
      return Array.from(modal.querySelectorAll('input, button'));
    }

    function open() {
      previousFocus = document.activeElement;
      modal.hidden = false;
      document.getElementById('modal-input').focus();
    }
    function close() {
      modal.hidden = true;
      if (previousFocus) previousFocus.focus();
    }

    openBtn.addEventListener('click', open);
    closeBtn.addEventListener('click', close);

    // Real focus trap: Tab cycles within the modal, Shift+Tab wraps backward.
    modal.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab') return;
      const items = focusable();
      const first = items[0];
      const last = items[items.length - 1];
      if (e.shiftKey && document.activeElement === first) {
        e.preventDefault();
        last.focus();
      } else if (!e.shiftKey && document.activeElement === last) {
        e.preventDefault();
        first.focus();
      }
    });

    // CORRECT Escape: closes the modal and restores focus to the trigger.
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !modal.hidden) close();
    });

    // Auto-open for testing.
    setTimeout(open, 100);
  </script>
</body>
</html>
