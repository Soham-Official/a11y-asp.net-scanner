<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>RTL</title>
<style>button{display:inline-block;width:120px;height:40px;margin:6px;}
  .bar{text-align:right;}</style></head>
<body>
  <!-- In RTL, the first DOM button renders rightmost; reading order right→left
       matches DOM order. Two rows of 4 = 8 focusables. -->
  <div class="bar">
    <button>١</button><button>٢</button><button>٣</button><button>٤</button>
  </div>
  <div class="bar">
    <button>٥</button><button>٦</button><button>٧</button><button>٨</button>
  </div>
</body></html>
