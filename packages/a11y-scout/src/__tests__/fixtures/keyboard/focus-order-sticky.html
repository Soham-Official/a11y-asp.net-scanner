<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Sticky header</title>
<style>
  header{position:sticky;top:0;background:#eee;padding:8px;}
  header button, main button{height:36px;margin:6px;}
  main{height:1500px;}
</style></head>
<body>
  <header>
    <button>Home</button><button>About</button><button>Contact</button>
  </header>
  <main>
    <button>Field 1</button><button>Field 2</button>
    <button>Field 3</button><button>Submit</button>
  </main>
</body></html>
